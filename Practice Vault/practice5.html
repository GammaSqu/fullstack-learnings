<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Toggle a CSS class on an element when a button is clicked</title>

    <style>
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 50px;
      }
      .box {
        height: 200px;
        width: 200px;
        background-color: gray;
        margin: 30px;
      }
      button {
        padding: 10px 15px;
        margin: 0 5px;
        border-radius: 7px;
        border: 1px solid;
        background-color: white;
        font-size: 17px;
      }

      .colourChange {
        border-color: blue;
        color: blue;
      }
      .colourChange:hover {
        background-color: blue;
        color: white;
      }

      .redColour {
        background-color: red;
      }

      .sizeChange {
        border-color: brown;
        color: brown;
      }

      .sizeChange:hover {
        background-color: brown;
        color: white;
      }

      .bigger {
        height: 400px;
        width: 400px;
      }

      .visibility {
        border-color: red;
        color: red;
      }

      .visibility:hover {
        background-color: red;
        color: white;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button class="colourChange">Change the box background to "red"</button>
      <button class="sizeChange">Make the box become bigger</button>
      <button class="visibility">Hide the box?</button>
    </div>
    <div class="box"></div>

    <script>
      let box = document.querySelector('.box');

      let colourButton = document.querySelector('.colourChange');
      let sizeButton = document.querySelector('.sizeChange');
      let visibilityButton = document.querySelector('.visibility');

      let changeBoxColour = function () {
        if (box.classList.contains('redColour')) {
          box.classList.remove('redColour');

          colourButton.innerHTML = 'Change the box background to "red"';
        } else {
          box.classList.add('redColour');

          colourButton.innerHTML =
            'Change the box background to default colour';
        }
      };

      let changeBoxSize = function () {
        if (box.classList.contains('bigger')) {
          box.classList.remove('bigger');

          sizeButton.innerHTML = 'Make the box become bigger';
        } else {
          box.classList.add('bigger');

          sizeButton.innerHTML = 'Make the box become normal';
        }
      };

      let changeBoxVisibility = function () {
        if (box.classList.contains('hidden')) {
          box.classList.remove('hidden');

          visibilityButton.innerHTML = 'Hide the box?';
        } else {
          box.classList.add('hidden');

          visibilityButton.innerHTML = 'SHOW THE BOX!';
        }
      };

      colourButton.addEventListener('click', changeBoxColour);
      sizeButton.addEventListener('click', changeBoxSize);
      visibilityButton.addEventListener('click', changeBoxVisibility);
    </script>
  </body>
</html>
