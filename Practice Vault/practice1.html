<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Select a Button and add click event to trigger an alert</title>

    <style>
      body {
        display: flex;
        justify-content: center;
      }

      button {
        background-color: blue;
        color: white;
        font-size: 17px;
        padding-top: 10px;
        padding-bottom: 10px;
        padding-left: 15px;
        padding-right: 15px;
        border-radius: 5px;
        margin: 10px;
        border: none;
      }
    </style>
  </head>
  <body>
    <button>Click me to open an alert</button>
  </body>

  <script>
    let alertButton = document.querySelector('button');
    alertButton.addEventListener('click', function () {
      alert('You clicked the button!');
    });
  </script>
</html>
