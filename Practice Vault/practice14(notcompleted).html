<!DOCTYPE html>

  <head>
    <title>
      Intermediate - Move a box within a container when buttons are clicked
    </title>

    <style>
      body {
        display: flex;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .controls {
        display: flex;
        justify-content: center;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        margin: 20px;
      }

      button {
        height: 60px;
        width: 60px;
        border: 1px solid grey;
      }

      button:hover {
        background-color: darkgrey;
      }

      .border {
        background-color: transparent;
        width: 700px;
        height: 500px;
        border-style: dashed;
        margin: 10px auto;
      }
      .box {
        background-color: grey;
        width: 100px;
        height: 100px;
      }
    </style>
  </head>

    <div class="container">
      <div>
        <div class="controls">
          <button class="upBtn" data-component="direction">Up</button>
